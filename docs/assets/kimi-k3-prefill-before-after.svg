<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kimi-K3 50K/500 output throughput before and after one-pass Gluon MLA prefill</title>
  <desc id="desc">Grouped bar chart comparing baseline and optimized output tokens per second at concurrency 1, 2, 4, 8, and 16.</desc>

  <rect width="1200" height="760" rx="18" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">
    Kimi-K3 50K/500: one-pass Gluon MLA prefill
  </text>
  <text x="600" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">
    Aggregate output throughput · 8× MI350X (gfx950) · TP8/EP1 · higher is better
  </text>

  <rect x="408" y="108" width="20" height="20" rx="3" fill="#64748b"/>
  <text x="438" y="124" font-family="sans-serif" font-size="16" fill="#334155">Before (main cae0f292)</text>
  <rect x="635" y="108" width="20" height="20" rx="3" fill="#10b981"/>
  <text x="665" y="124" font-family="sans-serif" font-size="16" fill="#334155">After (e3185b83)</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="620" x2="1140" y2="620"/>
    <line x1="100" y1="545" x2="1140" y2="545"/>
    <line x1="100" y1="470" x2="1140" y2="470"/>
    <line x1="100" y1="395" x2="1140" y2="395"/>
    <line x1="100" y1="320" x2="1140" y2="320"/>
    <line x1="100" y1="245" x2="1140" y2="245"/>
    <line x1="100" y1="170" x2="1140" y2="170"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="end">
    <text x="88" y="625">0</text>
    <text x="88" y="550">10</text>
    <text x="88" y="475">20</text>
    <text x="88" y="400">30</text>
    <text x="88" y="325">40</text>
    <text x="88" y="250">50</text>
    <text x="88" y="175">60</text>
  </g>
  <text x="28" y="395" transform="rotate(-90 28 395)" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#334155">
    Output tokens/s
  </text>

  <g fill="#64748b">
    <rect x="125" y="476.23" width="70" height="143.77" rx="5"/>
    <rect x="330" y="412.25" width="70" height="207.75" rx="5"/>
    <rect x="535" y="349.33" width="70" height="270.67" rx="5"/>
    <rect x="740" y="328.70" width="70" height="291.30" rx="5"/>
    <rect x="945" y="290.98" width="70" height="329.02" rx="5"/>
  </g>
  <g fill="#10b981">
    <rect x="205" y="412.40" width="70" height="207.60" rx="5"/>
    <rect x="410" y="352.70" width="70" height="267.30" rx="5"/>
    <rect x="615" y="285.13" width="70" height="334.87" rx="5"/>
    <rect x="820" y="235.55" width="70" height="384.45" rx="5"/>
    <rect x="1025" y="219.20" width="70" height="400.80" rx="5"/>
  </g>

  <g font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g fill="#475569">
      <text x="160" y="466">19.17</text>
      <text x="365" y="402">27.70</text>
      <text x="570" y="339">36.09</text>
      <text x="775" y="318">38.84</text>
      <text x="980" y="281">43.87</text>
    </g>
    <g fill="#047857">
      <text x="240" y="402">27.68</text>
      <text x="445" y="343">35.64</text>
      <text x="650" y="275">44.65</text>
      <text x="855" y="226">51.26</text>
      <text x="1060" y="210">53.44</text>
    </g>
  </g>

  <g font-family="sans-serif" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">
    <text x="200" y="380">+44.4%</text>
    <text x="405" y="320">+28.7%</text>
    <text x="610" y="252">+23.7%</text>
    <text x="815" y="202">+32.0%</text>
    <text x="1020" y="186">+21.8%</text>
  </g>

  <g font-family="sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="middle">
    <text x="200" y="650">C1</text>
    <text x="405" y="650">C2</text>
    <text x="610" y="650">C4</text>
    <text x="815" y="650">C8</text>
    <text x="1020" y="650">C16</text>
  </g>
  <text x="620" y="686" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#334155">Concurrency</text>

  <text x="600" y="727" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">
    One excluded warmup wave + one measured wave per concurrency · FP8 KV · EAGLE3 · zero prefix-cache hits
  </text>
</svg>
